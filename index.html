<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Club - Mavila Yuvadhara Arts and Sports Club</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* Modern Dark Theme Base with Global Matrix Layering */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d1117; 
            color: #c9d1d9;
            line-height: 1.6;
        }

        /* Full Background Matrix Canvas Wrapper */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; 
            pointer-events: none;
        }

        /* Content Wrappers tweaked with slight transparency & blur for maximum text readability */
        header, nav, main, footer {
            position: relative;
            z-index: 2; 
        }

        /* Heading Styles Override */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Shifting Lightning Gradient Header */
        header {
            padding: 40px 30px;
            background: linear-gradient(135deg, rgba(31, 28, 44, 0.93), rgba(77, 70, 110, 0.93), rgba(31, 28, 44, 0.93));
            background-size: 400% 400%;
            animation: lightningShift 8s ease infinite;
            color: #ffffff;
            border-bottom: 2px solid #30363d;
            backdrop-filter: blur(8px); 
        }

        @keyframes lightningShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Header Split Layout System */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-row-names {
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        /* Header Layout Units */
        .header-left {
            text-align: left;
            flex: 1;
            min-width: 250px;
        }

        .header-center {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1; 
            min-width: 200px;
            padding: 0 15px;
        }

        .header-right {
            text-align: right;
            flex: 1;
            min-width: 250px;
        }

        /* Logo Configuration (Transparent/White Blend) */
        .header-logo {
            max-width: 150px; 
            height: auto;
            background: transparent;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.3));
        }

        /* Nature Image Placement Styling */
        .nature-banner-container {
            max-width: 1100px;
            margin: 20px auto 40px auto;
            padding: 0 20px;
        }

        .nature-bg-banner {
            width: 100%;
            height: 220px; 
            object-fit: cover; 
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: block;
        }

        /* Typography Configurations */
        .header-left h1.malayalam-title-header {
            font-family: 'Gayathri', 'Manjari', sans-serif;
            font-size: 2.6em; 
            margin: 0;
            color: #ffd700; 
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            line-height: 1.3;
        }

        .header-right h1.english-title-header {
            margin: 0;
            font-size: 2.3em; 
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            line-height: 1.3;
        }

        .malayalam-address {
            font-family: 'Gayathri', 'Manjari', sans-serif;
            font-size: 1.55em; 
            color: #e2e8f0;
            line-height: 1.6;
            margin: 0;
        }

        .english-address {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15em; 
            color: #cbd5e1;
            line-height: 1.6;
            margin: 0;
        }

        .malayalam-text {
            font-family: 'Gayathri', 'Manjari', sans-serif;
            font-weight: 700;
        }

        /* Navigation */
        nav {
            text-align: center;
            padding: 14px;
            background-color: rgba(22, 27, 34, 0.9);
            border-bottom: 1px solid #30363d;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95em;
            backdrop-filter: blur(6px);
        }
        nav a {
            color: #58a6ff;
            text-decoration: none;
            padding: 0 15px;
            font-weight: 600;
            transition: color 0.2s, text-shadow 0.2s;
        }
        nav a:hover {
            color: #58a6ff;
            text-shadow: 0 0 8px #58a6ff;
        }

        main {
            max-width: 1100px; 
            margin: 20px auto;
            padding: 0 20px;
        }

        #welcome {
            padding: 40px 30px;
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid #30363d;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .welcome-content h2 {
            margin-top: 0;
            font-size: 2em;
            color: #ffffff;
        }
