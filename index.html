<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Club - Mavila Yuvadhara Arts and Sports Club</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Modern Dark Theme Base for Graphic Contrast */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d1117; 
            color: #c9d1d9;
        }

        /* 1. Shifting Lightning Gradient Header */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1f1c2c, #4d466e, #1f1c2c);
            background-size: 400% 400%;
            animation: lightningShift 8s ease infinite;
            color: #ffffff;
            border-bottom: 2px solid #30363d;
        }

        @keyframes lightningShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        /* Navigation */
        nav {
            text-align: center;
            padding: 12px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }
        nav a {
            color: #58a6ff;
            text-decoration: none;
            padding: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            color: #58a6ff;
            text-shadow: 0 0 8px #58a6ff;
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Interactive Moving Matrix Canvas Background */
        #welcome {
            position: relative;
            padding: 30px;
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .welcome-content {
            position: relative;
            z-index: 2;
        }

        /* Moving Neon Glow for Registration Block */
        .join-us-section {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin: 30px 0;
            box-shadow: 0 0 15px rgba(46, 164, 79, 0.1);
        }
        
        .register-btn {
            display: inline-block;
            background-color: #2ea44f;
            color: white;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 15px;
            animation: electricGreenPulse 2s infinite alternate;
            transition: transform 0.2s;
        }
        .register-btn:hover {
            transform: scale(1.05);
        }

        @keyframes electricGreenPulse {
            0% { box-shadow: 0 0 5px rgba(46, 164, 79, 0.4), inset 0 0 5px rgba(46, 164, 79, 0.2); }
            100% { box-shadow: 0 0 22px rgba(46, 164, 79, 0.85), inset 0 0 10px rgba(46, 164, 79, 0.4); }
        }

            padding: 20px;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #303
